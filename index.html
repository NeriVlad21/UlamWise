<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UlamWise — Plan smarter. Shop tipid.</title>
    <meta
      name="description"
      content="Plan smarter. Shop tipid. Mobile-first Filipino meal planning and smart grocery budgeting application with regional customization, deterministic allergen safety, and itemized palengke grocery lists."
    />
    <meta property="og:title" content="UlamWise — Plan smarter. Shop tipid." />
    <meta
      property="og:description"
      content="Mobile-first Filipino meal planner and smart grocery budgeting app with regional dishes, allergen checks, and itemized palengke lists."
    />
    <meta name="theme-color" content="#1B4D3E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UlamWise" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ulamwise_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#1E2421] dark:bg-[#111815] dark:text-[#F2EFE9] antialiased selection:bg-[#1B4D3E]/15 selection:text-[#1B4D3E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
